name: Deploy Mini Project 4

on:
  workflow_dispatch:
    inputs:
      action:
        description: Apply the stack or destroy it after review
        type: choice
        options: [apply, destroy]
        default: apply
        required: true

permissions:
  contents: read

concurrency:
  group: mini-project-4-terraform
  cancel-in-progress: false

jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_ssh_allowed_cidr: ${{ vars.SSH_ALLOWED_CIDR }}
      TF_VAR_ec2_ssh_public_key: ${{ vars.EC2_SSH_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: MiniProject4-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Set up Python and Ansible
        if: inputs.action == 'apply'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        if: inputs.action == 'apply'
        run: python -m pip install --disable-pip-version-check ansible-core
        working-directory: .

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Apply Terraform stack
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve

      - name: Configure Nginx with Ansible
        if: inputs.action == 'apply'
        env:
          ANSIBLE_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          host="$(terraform output -raw instance_public_ip)"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s
' "$ANSIBLE_PRIVATE_KEY" > "$key_file"
          cat > /tmp/mini-project-4-inventory.ini <<EOF
          [web]
          $host ansible_user=ec2-user ansible_ssh_private_key_file=$key_file ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
          EOF
          ansible-playbook -i /tmp/mini-project-4-inventory.ini ../ansible/playbook.yml
          echo "Web URL: $(terraform output -raw web_url)"
          echo "Backup bucket: $(terraform output -raw backup_bucket_name)"

      - name: Destroy Terraform stack
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
